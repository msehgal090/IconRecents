name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK 17 (setup-java v5) ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle 8.9 (no wrapper jar needed) ────────────────────────────────
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ── 4. XposedBridge API jar ───────────────────────────────────────────────
      #   Try two reliable sources. If both fail, Gradle will fall back to the
      #   api.xposed.info Maven repo declared in settings.gradle.kts.
      - name: Download XposedBridge API jar
        continue-on-error: true
        run: |
          mkdir -p app/libs
          echo "Attempting to download XposedBridge api-82.jar..."
          # Source 1 — official Xposed info Maven
          curl --fail --silent --location \
            "https://api.xposed.info/xposed/api/82/api.jar" \
            -o app/libs/api-82.jar && echo "✅ Downloaded from api.xposed.info" && exit 0
          # Source 2 — JitPack hosted snapshot
          curl --fail --silent --location \
            "https://jitpack.io/com/github/rovo98/XposedBridge/82.0/XposedBridge-82.0.jar" \
            -o app/libs/api-82.jar && echo "✅ Downloaded from JitPack" && exit 0
          echo "⚠️  Jar download failed — Gradle will use Maven repo directly"

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      # ── 6. Upload artifact ───────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IconRecents-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
